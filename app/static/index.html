
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Spam Detector</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0f172a;
      color: #f8fafc;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 560px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 20px;
      padding: 32px;
    }

    h1 { margin-bottom: 8px; }
    p { color: #94a3b8; line-height: 1.5; }

    textarea {
      width: 100%;
      min-height: 150px;
      padding: 16px;
      border: 1px solid #475569;
      border-radius: 12px;
      background: #0f172a;
      color: white;
      font: inherit;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 16px;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #6366f1;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled { opacity: 0.6; }

    #result {
      display: none;
      margin-top: 20px;
      padding: 18px;
      border-radius: 12px;
      background: #334155;
    }

    .spam { color: #f87171; }
    .ham { color: #4ade80; }
    .error { color: #fca5a5; }
  </style>
</head>
<body>
  <main class="card">
    <h1>🛡️ AI Spam Detector</h1>
    <p>Detect suspicious SMS messages using Machine Learning and NLP.</p>

    <form id="spamForm">
      <textarea id="message" placeholder="Paste your SMS message here..." required></textarea>
      <button id="analyzeBtn" type="submit">Analyze Message</button>
    </form>

    <section id="result" aria-live="polite">
      <h2 id="prediction"></h2>
      <p id="confidence"></p>
    </section>

    <p>Powered by TF-IDF, Logistic Regression & FastAPI</p>
  </main>

  <script>
    const form = document.getElementById("spamForm");
    const result = document.getElementById("result");
    const button = document.getElementById("analyzeBtn");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const message = document.getElementById("message").value.trim();
      if (!message) return;

      button.disabled = true;
      button.textContent = "Analyzing...";
      result.style.display = "none";

      try {
        const response = await fetch("/predict", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message })
        });

        if (!response.ok) throw new Error("Prediction failed");

        const data = await response.json();
        const title = document.getElementById("prediction");

        title.textContent = data.prediction === "Spam"
          ? "⚠️ Spam Detected"
          : "✅ Not Spam";

        title.className = data.prediction === "Spam" ? "spam" : "ham";

        document.getElementById("confidence").textContent =
          `Model confidence: ${data.confidence}%`;

        result.style.display = "block";
      } catch (error) {
        const title = document.getElementById("prediction");
        title.textContent = "Unable to analyze message";
        title.className = "error";
        document.getElementById("confidence").textContent =
          "Please try again.";
        result.style.display = "block";
      } finally {
        button.disabled = false;
        button.textContent = "Analyze Message";
      }
    });
  </script>
</body>
</html>
